name: Live DeepSeek research memo acceptance

on:
  workflow_dispatch:
    inputs:
      model:
        description: Fixed model for up to three independent S-05 samples (stop on failure)
        required: true
        default: deepseek-v4-pro
        type: choice
        options:
          - deepseek-v4-pro

permissions:
  contents: read

concurrency:
  group: live-research-memo
  cancel-in-progress: false

jobs:
  live-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MODEL_PROVIDER: deepseek
    steps:
      - uses: actions/checkout@v4
      - name: Check configured API credential without printing it
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node -e 'if (!process.env.DEEPSEEK_API_KEY?.trim()) { console.error("Add repository Actions secret DEEPSEEK_API_KEY, then run this workflow again."); process.exit(1); }'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app without API credentials
        run: npm run build
      - name: Install isolated browser tool
        run: |
          npm install --prefix "$RUNNER_TEMP/research-browser" --no-package-lock --no-save --no-audit --no-fund playwright@1.62.1
          echo "PLAYWRIGHT_PACKAGE_PATH=$RUNNER_TEMP/research-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Prepare Chromium
        run: node "$PLAYWRIGHT_PACKAGE_PATH/cli.js" install --with-deps chromium
      - name: Up to three sequential S-05 live samples, one request each, stop on failure
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.model }}
          LIVE_MODEL_E2E: '1'
        run: node --experimental-strip-types scripts/run-memo-batch.mjs
      - name: Preserve real call, memo, review and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deepseek-research-memo-${{ github.run_id }}
          path: apps/web/artifacts-web/
          if-no-files-found: warn
