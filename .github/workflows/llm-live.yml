name: Live research memo acceptance

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model for this one-call acceptance run
        required: true
        default: gpt-5.6-sol
        type: string

permissions:
  contents: read

concurrency:
  group: live-research-memo
  cancel-in-progress: false

jobs:
  live-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check configured API credential without printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node -e 'if (!process.env.OPENAI_API_KEY) { console.error("Add repository Actions secret OPENAI_API_KEY, then run this workflow again."); process.exit(1); }'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production app without API credentials
        run: npm run build
      - name: Install isolated browser tool
        run: |
          npm install --prefix "$RUNNER_TEMP/research-browser" --no-package-lock --no-save --no-audit --no-fund playwright@1.62.1
          echo "PLAYWRIGHT_PACKAGE_PATH=$RUNNER_TEMP/research-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Prepare Chromium
        run: node "$PLAYWRIGHT_PACKAGE_PATH/cli.js" install --with-deps chromium
      - name: One real S-05 upload and one live model request with review and export
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          LIVE_MODEL_E2E: '1'
        run: npm run test:browser
      - name: Preserve real call, memo, review and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-research-memo-${{ github.run_id }}
          path: apps/web/artifacts-web/
          if-no-files-found: warn
