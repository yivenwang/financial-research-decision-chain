name: Web research integration

on:
  push:
    branches: [main, dev/github-web-v5, dev/web-engine-v01]
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'lib/**'
      - '.github/workflows/web.yml'
      - 'snapshots/web-v5-migration.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_PACKAGE_PATH: ${{ runner.temp }}/research-browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact exported dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve V5 S-05 and S-06 fixture behavior
        run: npm test
      - name: Verify unchanged V5 source files
        run: node scripts/verify-migration.mjs
      - name: Build standalone Next.js app
        run: npm run build
      - name: Check production HTML, CSS and PDF worker
        run: npm run test:runtime
      - name: Install isolated browser test tool
        run: npm install --prefix "$RUNNER_TEMP/research-browser" --no-package-lock --no-save --no-audit --no-fund playwright@1.62.1
      - name: Prepare Chromium
        run: node "$PLAYWRIGHT_PACKAGE_PATH/cli.js" install --with-deps chromium
      - name: Real S-05 and isolated S-06 browser upload, review, save and rollback
        run: npm run test:browser
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-research-audit-${{ github.run_id }}
          path: apps/web/artifacts-web/
          if-no-files-found: warn
