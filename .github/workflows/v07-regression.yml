name: V0.7 Adjusted Label Regression

on:
  push:
    branches:
      - dev/v0.7-adjusted-label
  pull_request:
    branches:
      - main

jobs:
  v07-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve frozen Chain V0.1
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- lib/chain-v01.ts docs/CHAIN_V0.1_SPEC.md
      - name: Existing V0.6 regression remains green
        run: node --experimental-strip-types --test tests/pdf-v06-regression.test.mjs
      - name: V0.7 real PDF regression including S-10
        run: node --experimental-strip-types --test tests/pdf-v07-regression.test.mjs
