name: V0.6 Restated Column Regression

on:
  push:
    branches:
      - dev/v0.6-restated-columns
  pull_request:
    branches:
      - main

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect financial engine changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- lib tests package.json package-lock.json docs/CHAIN_V0.1_SPEC.md; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi

  v06-regression:
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve frozen Chain V0.1
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- lib/chain-v01.ts docs/CHAIN_V0.1_SPEC.md
      - name: Existing V0.5 regression remains green
        run: |
          node --experimental-strip-types --test tests/pdf-v05-regression.test.mjs
          node --experimental-strip-types --test tests/pdf-v05-strict-schema.test.mjs
      - name: V0.6 real PDF regression including S-09
        run: node --experimental-strip-types --test tests/pdf-v06-regression.test.mjs
