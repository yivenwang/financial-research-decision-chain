name: V0.5 PDF Regression

on:
  push:
    branches:
      - dev/v0.5-short-value-columns
  pull_request:
    branches:
      - main

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect financial engine changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Layout-only parser PRs run parser-layout.yml's explicit allowed corpus.
        # Other engine changes retain the original broad regression jobs.
        run: node scripts/parser-layout-ci-scope.mjs

  v05-regression:
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preserve V0.4 fixture regression
        run: npm run test:parser

      - name: Run V0.5 real S-05/S-06/S-07 value regression
        run: node --experimental-strip-types --test tests/pdf-v05-regression.test.mjs

      - name: Run V0.5 strict primary-schema gate
        run: node --experimental-strip-types --test tests/pdf-v05-strict-schema.test.mjs

      - name: Upload V0.5 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-regression-audit
          path: artifacts-v05/*.json
          if-no-files-found: warn
