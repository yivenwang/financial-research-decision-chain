name: Chain V0.1 C-04 Regression

on:
  push:
    branches:
      - dev/chain-v01-c04
  pull_request:
    branches:
      - main

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect financial engine changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- lib tests package.json package-lock.json docs/CHAIN_V0.1_SPEC.md; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi

  chain-regression:
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Parser V0.5 regression stays green
        run: |
          node --experimental-strip-types --test tests/pdf-v05-regression.test.mjs
          node --experimental-strip-types --test tests/pdf-v05-strict-schema.test.mjs

      - name: Deterministic C-04 chain unit regression
        run: node --experimental-strip-types --test tests/chain-v01.test.mjs

      - name: Real official PDF chain regression
        run: node --experimental-strip-types --test tests/chain-v01-real-pdf.test.mjs
