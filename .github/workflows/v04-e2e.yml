name: V0.4 PDF E2E

on:
  push:
    branches:
      - dev/v0.4-e2e
  pull_request:
    branches:
      - main

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.changes.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect financial engine changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- lib tests package.json package-lock.json docs/CHAIN_V0.1_SPEC.md; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi

  parser-e2e:
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Confirm frozen parser unchanged from main
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- lib/parser-v04.ts

      - name: Fixture regression
        run: npm run test:parser

      - name: Real official PDF.js E2E
        run: npm run test:e2e

      - name: Blind Test 02 S-07 first run
        run: node --experimental-strip-types --test tests/s07-first-run.mjs

      - name: Upload E2E audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-test-02-audit
          path: artifacts/*.json
          if-no-files-found: error
